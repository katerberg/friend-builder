name: flutter_contacts
description: "Patched flutter_contacts 2.1.0 (ObjC shim for static-framework iOS module clash)."
version: 2.1.0+friendbuilder.1
publish_to: "none"
repository: https://github.com/QuisApp/flutter_contacts

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: co.quis.flutter_contacts
        pluginClass: FlutterContactsPlugin
      ios:
        pluginClass: FlutterContactsPlugin
      macos:
        pluginClass: FlutterContactsPlugin
